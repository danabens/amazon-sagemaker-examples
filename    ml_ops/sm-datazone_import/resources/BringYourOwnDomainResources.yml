AWSTemplateFormatVersion: '2010-09-09'

Resources:
  DataZoneFederationRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'datazone_environment_federation_role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'auth.datazone.amazonaws.com'
                - 'datazone.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
              - 'sts:TagSession'
 
  DataZoneFederationPolicy:
    DependsOn: ['DataZoneFederationRole']
    Type: 'AWS::IAM::Policy'
    Properties:
      Roles:
        - !Ref DataZoneFederationRole
      PolicyName: !Sub 'datazone-usr-federation-policy'
      PolicyDocument:
        Statement:
          - Action:
              - 'sagemaker:CreateUserProfile'
              - 'sagemaker:DescribeUserProfile'
              - 'sagemaker:CreatePresignedDomainUrl'
              - 'sagemaker:ListTags'
              - 'sagemaker:AddTags'
              - 'sagemaker:UpdateDomain'
              - 'sagemaker:DescribeDomain'
              - 'iam:ListRoleTags'
            Effect: Allow
            Resource: '*'